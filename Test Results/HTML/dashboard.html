<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Selenium Test Analytics Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #0F172A; color: #F8FAFC; padding: 2rem; }
        .card { background: #1E293B; border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; border: 1px solid #334155; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; }
        .metric { font-size: 2.5rem; font-weight: bold; margin-top: 10px; color: #38BDF8; }
    </style>
</head>
<body>
    <h1>🚀 Live Production Selenium Dashboard</h1>
    <div class="grid">
        <div class="card"><div>Total Executed</div><div class="metric">470</div></div>
        <div class="card"><div>Pass Percentage</div><div class="metric" style="color: #4ADE80;">100.0%</div></div>
        <div class="card"><div>Total Failures</div><div class="metric" style="color: #F87171;">0</div></div>
    </div>
</body>
</html>
